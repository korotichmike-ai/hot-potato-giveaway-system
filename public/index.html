<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hot Potato Arena</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;600&display=swap">
<style>
  :root { color-scheme: dark; --ink:#0e1517; --fg:#eef3f1; --muted:#93a6a3; --ember:#ff8a3d; }
  body { margin:0; background:var(--ink); color:var(--fg); font:16px/1.55 "Figtree", system-ui, sans-serif; }
  main { max-width:520px; margin:0 auto; padding:56px max(16px, env(safe-area-inset-right, 0px)) 56px max(16px, env(safe-area-inset-left, 0px)); display:grid; gap:14px; }
  h1 { font:400 34px/1.1 "Bungee", "Arial Black", sans-serif; margin:0; } h1 span { color:var(--ember); }
  p { margin:0; color:var(--muted); } a { color:var(--fg); }
</style>
</head>
<body>
<main>
  <h1>Hot Potato <span>Arena</span></h1>
  <p>Stream giveaways where the last ball standing wins. Every round can be checked on its verify page.</p>
  <p><a href="/claim/">Claim a prize</a></p>
</main>
</body>
</html>
