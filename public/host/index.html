<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Hot Potato Host</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: single phone-width column (second screen while streaming): status + main action first, prize, entrants, links.
   Single dark theme to match the overlay. */
:root{
  color-scheme: dark;
  --ink:#0e1517; --deck:#162124; --rule:#26363a; --fg:#eef3f1; --muted:#93a6a3;
  --ember:#ff8a3d; --gold:#f3c14b; --clover:#5fd47a; --bad:#ff6b6b;
  --f-display:"Bungee","Arial Black",Impact,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--ink)}
body{margin:0;background:var(--ink);color:var(--fg);font:16px/1.5 var(--f-body);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:560px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font:400 24px/1 var(--f-display);margin:0}
h1 span{color:var(--ember)}
h2{font:600 12px/1 var(--f-body);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0}
p{margin:0}
.panel{background:var(--deck);border:1px solid var(--rule);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.pill{font:700 12px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;padding:7px 10px;border-radius:999px;background:rgba(147,166,163,.15);color:var(--muted);white-space:nowrap}
.pill.open{background:rgba(95,212,122,.16);color:var(--clover)}
.pill.locked,.pill.draft{background:rgba(243,193,75,.16);color:var(--gold)}
.pill.running,.pill.done{background:rgba(255,138,61,.18);color:var(--ember)}
.pill.expired{background:rgba(255,107,107,.15);color:var(--bad)}
.pill.claimed{background:rgba(95,212,122,.16);color:var(--clover)}
.big{font:600 44px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.stats{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:15px;color:var(--muted)}
.stats b{color:var(--fg);font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:700 17px var(--f-body);border-radius:10px;padding:14px 18px;cursor:pointer;border:1px solid var(--rule);background:var(--ink);color:var(--fg);width:100%;min-height:52px}
button.primary{background:var(--ember);border-color:var(--ember);color:#1b0d03}
button.small{font-size:14px;min-height:40px;padding:8px 12px;width:auto}
button.link{background:none;border:0;color:var(--muted);text-decoration:underline;min-height:0;padding:4px 0;width:auto;font-weight:500;font-size:14px}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > *{flex:1 1 140px}
label{font-size:13px;color:var(--muted);display:grid;gap:6px}
input{font:500 16px var(--f-body);color:var(--fg);background:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:12px;width:100%;min-width:0}
.hint{font-size:14px;color:var(--muted)}
.err{color:var(--bad);font-size:14px;font-weight:600}
.locked-prize{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700;color:var(--clover)}
.winner{font:700 26px/1.2 var(--f-body)}
.sub{color:var(--gold)}
ul.ents{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-height:50vh;overflow:auto}
ul.ents li{display:flex;justify-content:space-between;gap:10px;padding:8px 2px;border-bottom:1px solid var(--rule);font-size:15px;min-width:0}
ul.ents li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
ul.ents li.rej{color:var(--muted)}
.tag{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.tag.s{color:var(--gold)}
.tag.r{color:var(--bad);text-transform:none;letter-spacing:0;font-weight:500;text-align:right;white-space:normal}
.mono{font:400 13px/1.5 var(--f-mono);color:var(--muted);overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Hot Potato <span>Host</span></h1>
    <span class="pill" id="pill" hidden></span>
  </header>

  <form class="panel" id="login" hidden>
    <h2>Sign in</h2>
    <label for="hostkey">Host key<input id="hostkey" type="password" autocomplete="current-password" required></label>
    <button class="primary" type="submit">Open the panel</button>
    <p class="hint">The host key is set on the server. Kick login replaces it in a later update.</p>
    <p class="err" id="loginerr" hidden></p>
  </form>

  <div id="app" hidden style="display:grid;gap:14px">
    <section class="panel" id="main" aria-live="polite"></section>
    <p class="err" id="err" hidden></p>

    <section class="panel" id="prizebox" hidden>
      <h2>Prize link</h2>
      <div id="prizelocked" class="locked-prize" hidden><span>🔒 Prize locked</span><button class="small" type="button" id="replace">Replace</button></div>
      <form id="prizeform" style="display:grid;gap:10px">
        <label for="prize">Paste the prize link. It is encrypted and never shown again, only the winner sees it.
          <input id="prize" type="password" autocomplete="new-password" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore placeholder="https://…">
        </label>
        <button type="submit">Save prize</button>
      </form>
    </section>

    <section class="panel" id="entbox" hidden>
      <h2>Entrants</h2>
      <div class="stats" id="entstats"></div>
      <div class="row" id="testrow" hidden>
        <button class="small" type="button" id="test10">+10 test viewers</button>
        <button class="small" type="button" id="test35">+35 test viewers</button>
      </div>
      <ul class="ents" id="ents"></ul>
    </section>

    <section class="panel">
      <h2>Links</h2>
      <div class="row">
        <button class="small" type="button" id="copyoverlay">Copy OBS overlay link</button>
        <button class="small" type="button" id="openpreview">Preview overlay</button>
      </div>
      <p class="hint">Add the overlay link in OBS as a Browser Source, 1920 × 1080. Keep it off screen when you copy it, because it contains the overlay key.</p>
      <p class="mono" id="verifylink" hidden></p>
      <button class="link" type="button" id="signout">Sign out of this device</button>
    </section>
  </div>
</div>

<script type="module">
const $ = id => document.getElementById(id);
const store = {
  get() { try { return localStorage.getItem('hp-host-key') || ''; } catch { return ''; } },
  set(v) { try { v ? localStorage.setItem('hp-host-key', v) : localStorage.removeItem('hp-host-key'); } catch {} },
};
let key = store.get();
let state = null, clockOffset = 0, busy = false, replacing = false;
const now = () => Date.now() + clockOffset;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mmss = ms => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

async function call(path, body) {
  const res = await fetch('/api/host' + path, {
    method: body === undefined ? 'GET' : 'POST',
    headers: { authorization: 'Bearer ' + key, ...(body === undefined ? {} : { 'content-type': 'application/json' }) },
    body: body === undefined ? undefined : JSON.stringify(body),
    cache: 'no-store',
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { signOut('That host key was not accepted.'); throw new Error('Signed out'); }
  if (!res.ok) throw new Error(data.error || 'The server did not respond. Check your connection and try again.');
  return data;
}

function signOut(message) {
  key = ''; store.set(''); state = null;
  $('app').hidden = true; $('pill').hidden = true; $('login').hidden = false;
  $('loginerr').textContent = message || ''; $('loginerr').hidden = !message;
}

async function refresh() {
  if (!key) return;
  try {
    const s = await call('/state');
    clockOffset = s.now - Date.now();
    state = s;
    $('login').hidden = true; $('app').hidden = false;
    render();
  } catch (e) {
    if (e.message !== 'Signed out') showError(e.message);
  }
}

function showError(m) { $('err').textContent = m; $('err').hidden = !m; }

async function act(action, body = {}) {
  if (busy) return;
  busy = true; showError('');
  document.querySelectorAll('#main button').forEach(b => { b.disabled = true; });
  try {
    const g = state?.giveaway;
    const s = action === 'new' ? (await call('/giveaways', body), await call('/state')) : await call(`/giveaways/${g.id}/${action}`, body);
    clockOffset = s.now - Date.now();
    state = s;
  } catch (e) {
    if (e.message !== 'Signed out') showError(e.message);
  } finally {
    busy = false;
    delete $('main').dataset.sig;
    if (state) render();
  }
}

const LABEL = { draft: 'Setting up', open: 'Entries open', locked: 'Entries locked', running: 'Round playing', done: 'Waiting for claim', expired: 'Not claimed', claimed: 'Claimed', cancelled: 'Cancelled' };

function render() {
  const g = state.giveaway, main = $('main');
  const ents = state.entrants || [];
  const ok = ents.filter(e => !e.rejectedReason);
  const pill = $('pill');
  pill.hidden = !g || ['cancelled'].includes(g.status);
  if (g) { pill.textContent = LABEL[g.status] || g.status; pill.className = 'pill ' + g.status; }

  const preLaunch = g && ['draft', 'open', 'locked'].includes(g.status);
  let html = '';
  // Only rebuild the main card when something on it changed, so typing in it isn't interrupted by polling.
  const sig = JSON.stringify([g?.id, g?.status, g?.nonce, g?.prizeSet, ok.length, ok.filter(e => e.isSub).length, g?.winner?.id]);
  const rebuild = sig !== main.dataset.sig;
  main.dataset.sig = sig;
  if (!rebuild) { /* keep the current card */ }
  else if (!g || ['claimed', 'cancelled'].includes(g.status)) {
    html += g?.status === 'claimed' && g.winner ? `<p class="hint">Last giveaway was claimed by <b class="${g.winner.isSub ? 'sub' : ''}">${esc(g.winner.username)}</b>.</p>` : '';
    html += newForm();
  } else if (g.status === 'draft') {
    html += `<h2>New giveaway</h2>
      <p class="hint">${g.prizeSet ? 'Prize is set.' : 'Add the prize link below, then open entries.'} Viewers join by typing <b>!join</b> in chat.</p>
      <div class="row"><label for="secs">Entry window (seconds)<input id="secs" type="number" inputmode="numeric" min="10" max="600" value="${g.entrySeconds}"></label></div>
      <button class="primary" id="b-open">Open entries</button>
      <button class="link" id="b-cancel">Cancel this giveaway</button>`;
  } else if (g.status === 'open') {
    html += `<h2>Entries close in</h2><div class="big" id="tick">${mmss(g.entriesCloseAt - now())}</div>
      <div class="stats"><span><b>${ok.length}</b> entered</span><span><b>${ok.filter(e => e.isSub).length}</b> subs</span></div>
      <button class="primary" id="b-lock">Close entries now</button>
      <button class="link" id="b-cancel">Cancel this giveaway</button>`;
  } else if (g.status === 'locked') {
    const blocked = !g.prizeSet ? 'Add the prize link below before launching.' : ok.length === 0 ? 'Nobody entered. Cancel and start a new giveaway.' : '';
    html += `<h2>Ready to launch</h2>
      <div class="stats"><span><b>${ok.length}</b> in the arena</span><span><b>${ok.filter(e => e.isSub).length}</b> subs (${g.subWeight}x luck)</span></div>
      ${blocked ? `<p class="err">${blocked}</p>` : ''}
      <button class="primary" id="b-launch" ${blocked ? 'disabled' : ''}>Launch</button>
      <button class="link" id="b-cancel">Cancel this giveaway</button>`;
  } else if (g.status === 'running') {
    html += `<h2>${g.nonce > 0 ? 'Reroll playing' : 'Round playing'}</h2><p class="hint">The winner shows on stream when the last ball pops.</p>
      <div class="big" id="tick">${mmss(g.launchedAt + g.roundMs - now())}</div>`;
  } else if (g.status === 'done') {
    html += `<h2>Winner</h2><p class="winner ${g.winner?.isSub ? 'sub' : ''}">${esc(g.winner?.username)}</p>
      <p class="hint">Waiting for them to claim. Time left:</p><div class="big" id="tick">${mmss(g.claimDeadline - now())}</div>`;
  } else if (g.status === 'expired') {
    html += `<h2>Not claimed in time</h2><p class="winner">${esc(g.winner?.username)}</p>
      <p class="hint">Reroll picks a new winner from everyone else who entered and plays a short replay on stream.</p>
      <button class="primary" id="b-reroll">Reroll</button>` + newForm(true);
  }
  if (rebuild) { main.innerHTML = html; delete main.dataset.confirm; }

  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on('b-open', () => act('open', { seconds: Number($('secs').value) }));
  on('b-lock', () => act('lock'));
  on('b-launch', () => act('launch'));
  on('b-reroll', () => act('reroll'));
  on('b-cancel', () => { if (main.dataset.confirm === 'cancel') { delete main.dataset.confirm; act('cancel'); } else { main.dataset.confirm = 'cancel'; $('b-cancel').textContent = 'Tap again to cancel'; } });
  on('b-new', () => act('new', { entrySeconds: Number($('n-secs').value), claimSeconds: Number($('n-claim').value) }));

  // Prize
  $('prizebox').hidden = !preLaunch;
  $('prizelocked').hidden = !(g?.prizeSet) || replacing;
  $('prizeform').hidden = !!g?.prizeSet && !replacing;

  // Entrants
  $('entbox').hidden = !g || g.status === 'cancelled';
  const subs = ok.filter(e => e.isSub).length, rej = ents.length - ok.length;
  $('entstats').innerHTML = `<span><b>${ok.length}</b> entered</span><span><b>${subs}</b> subs</span><span><b>${rej}</b> rejected</span>`;
  $('testrow').hidden = !(state.testEntrantsAllowed && g?.status === 'open');
  $('ents').innerHTML = [...ents].reverse().map(e => `<li class="${e.rejectedReason ? 'rej' : ''}"><span>${esc(e.username)}</span>${e.rejectedReason ? `<span class="tag r">${esc(e.rejectedReason)}</span>` : e.isSub ? '<span class="tag s">🍀 Sub</span>' : ''}</li>`).join('') || '<li class="rej"><span>No entries yet</span></li>';

  const showVerify = g && g.seedHash;
  $('verifylink').hidden = !showVerify;
  if (showVerify) $('verifylink').textContent = 'Verify page: ' + g.verifyUrl;
}

function newForm(compact) {
  const d = state.defaults;
  return `${compact ? '<h2 style="margin-top:8px">Or start fresh</h2>' : '<h2>Start a giveaway</h2>'}
    <div class="row">
      <label for="n-secs">Entry window (seconds)<input id="n-secs" type="number" inputmode="numeric" min="10" max="600" value="${d.entrySeconds}"></label>
      <label for="n-claim">Claim time (seconds)<input id="n-claim" type="number" inputmode="numeric" min="5" max="3600" value="${d.claimSeconds}"></label>
    </div>
    <button class="${compact ? '' : 'primary'}" id="b-new">New giveaway</button>`;
}

// Countdown ticks between polls.
setInterval(() => {
  const g = state?.giveaway, el = $('tick');
  if (!g || !el) return;
  const target = g.status === 'open' ? g.entriesCloseAt : g.status === 'running' ? g.launchedAt + g.roundMs : g.status === 'done' ? g.claimDeadline : null;
  if (target) el.textContent = mmss(target - now());
}, 250);

$('login').addEventListener('submit', e => {
  e.preventDefault();
  key = $('hostkey').value.trim();
  $('hostkey').value = '';
  store.set(key);
  refresh();
});
$('prizeform').addEventListener('submit', async e => {
  e.preventDefault();
  const link = $('prize').value.trim();
  $('prize').value = '';
  if (!link) { showError('Paste the prize link first.'); return; }
  replacing = false;
  await act('prize', { link });
});
$('replace').onclick = () => { replacing = true; render(); $('prize').focus(); };
$('test10').onclick = () => act('test-entrants', { count: 10, subPct: 20 });
$('test35').onclick = () => act('test-entrants', { count: 35, subPct: 20 });
$('signout').onclick = () => signOut();
$('copyoverlay').onclick = async () => {
  const url = state?.overlayUrl;
  if (!url) return showError('The overlay key is not set on the server.');
  try { await navigator.clipboard.writeText(url); $('copyoverlay').textContent = 'Copied'; setTimeout(() => { $('copyoverlay').textContent = 'Copy OBS overlay link'; }, 1500); }
  catch { showError('Copy failed. Long-press to copy instead: ' + url); }
};
$('openpreview').onclick = () => { if (state?.overlayUrl) window.open(state.overlayUrl + '&preview=1', '_blank', 'noopener'); };

if (key) { refresh(); } else { $('login').hidden = false; }
setInterval(() => { if (!busy && document.visibilityState === 'visible') refresh(); }, 1500);
</script>
</body>
</html>
