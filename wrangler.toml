name = "hot-potato-giveaway-system"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "hot-potato-arena"
# The hot-potato-arena D1 database in the Cloudflare account.
database_id = "9d4d3c26-4566-4f41-86ab-aabdc4b74377"
# Tables are created by the Worker itself on first request (src/migrate.js).

[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

[vars]
CHANNEL_ID = "default"
# Shown on the winner card, e.g. "potato.example.com". Leave empty to use the overlay's own host.
CLAIM_SITE = ""
DEFAULT_ENTRY_SECONDS = "45"
DEFAULT_CLAIM_SECONDS = "120"
SUB_WEIGHT = "3"
# Rehearsal button in the host panel. Set to "false" once real Kick chat entries work.
ALLOW_TEST_ENTRANTS = "true"
# Comma-separated Kick user ids or usernames that can never enter (bots etc.).
BLOCKLIST = "botrix,kickbot"
# The streamer's Kick channel (as in kick.com/<slug>). Only this account can log in to the host panel.
KICK_CHANNEL_SLUG = ""
# Public address of the site, e.g. "https://potato.example.com". Leave empty to use the request's own address.
# Kick app settings must use <PUBLIC_URL>/api/auth/callback as the redirect URL and <PUBLIC_URL>/api/kick/webhook as the webhook URL.
PUBLIC_URL = ""

# Secrets (set with `npx wrangler secret put NAME`, or in .dev.vars for local dev):
#   HOST_KEY      optional backup password for the host panel (Kick login is the normal way in)
#   OVERLAY_KEY   key in the OBS overlay link (any long random text)
#   PRIZE_KEY     encrypts prize links (any long random text, 16+ characters; never change it mid-giveaway)
#   KICK_CLIENT_ID, KICK_CLIENT_SECRET   from the streamer's app at kick.com/settings/developer
